name: Starry Persona validation
on:
  pull_request:
    paths:
      - 'apps/starry-persona/**'
      - '.github/workflows/persona-validation.yml'
  push:
    branches: [main]
    paths:
      - 'apps/starry-persona/**'
      - '.github/workflows/persona-validation.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/starry-persona
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- worker.js
