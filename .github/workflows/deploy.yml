name: Deploy Starry.phd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html styles.css app.js app-v5.js dist/
          cat meteor-v14.js visual-v15.js interaction-v16.js battery-game-v18.js >> dist/app-v5.js

      - name: Verify battery game bundle
        run: |
          grep -F "starry:meteor-blasted" dist/app-v5.js
          grep -F "https://id.starry.phd/api/starry-game/battery" dist/app-v5.js
          grep -F "點擊隕石爆破 +0.01" dist/app-v5.js

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.0"
          command: deploy

      - name: Verify production website
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --connect-timeout 10 --max-time 20 "https://starry.phd/?verify=${GITHUB_SHA}" -o /tmp/starry.html \
              && curl -fsS --connect-timeout 10 --max-time 20 "https://starry.phd/app-v5.js?verify=${GITHUB_SHA}" -o /tmp/starry-app.js; then
              break
            fi
            if [ "$attempt" = "6" ]; then
              echo "Production website could not be verified"
              exit 1
            fi
            sleep 5
          done
          grep -F "app-v5.js" /tmp/starry.html
          grep -F "starry:meteor-blasted" /tmp/starry-app.js
          grep -F "https://id.starry.phd/api/starry-game/battery" /tmp/starry-app.js

          status="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/battery-api.json -w '%{http_code}' "https://id.starry.phd/api/starry-game/battery")"
          test "$status" = "401"
          grep -F '"authenticated":false' /tmp/battery-api.json
