name: Deploy Starry.phd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html styles.css app.js app-v5.js manifest.webmanifest sw.js icon-192.png icon-512.png icon-192.svg icon-512.svg dist/
          cat meteor-reward-bands-v41.js meteor-v14.js visual-v15.js interaction-v16.js battery-game-v18.js site-meta-v24.js pwa-v25.js meteor-feedback-v27.js meteor-density-v28.js rapid-tap-guard-v30.js solid-planets-v32.js universe-readability-v41.js navigation-safe-v44.js >> dist/app-v5.js

      - name: Verify bundle
        run: |
          node --check dist/app-v5.js
          node --test tests/*.test.mjs
          grep -F 'starryMeteorRewardTier' dist/app-v5.js
          grep -F 'universe-readability-v41' dist/app-v5.js
          grep -F 'starrySafePlanetPosition' dist/app-v5.js
          grep -F "starry:meteor-blasted" dist/app-v5.js
          grep -F "https://id.starry.phd/api/starry-game/battery" dist/app-v5.js
          grep -F "https://id.starry.phd/api/google-sync" dist/app-v5.js
          grep -F "https://id.starry.phd/starry-main-login" dist/app-v5.js
          grep -F "use_fedcm_for_prompt" dist/app-v5.js
          grep -F "starry-login-sheet" dist/app-v5.js
          grep -F -- "--rock-poly" dist/app-v5.js
          grep -F "#immersiveToggle{display:none!important}" dist/app-v5.js
          grep -F "reward.toFixed(2)" dist/app-v5.js
          grep -F "battery-reward-instant" dist/app-v5.js
          grep -F "獎勵 +" dist/app-v5.js
          grep -F "polygon(50% 0,100% 88%,6% 100%)" dist/app-v5.js
          grep -F ".status-pill{display:none!important}" dist/app-v5.js
          grep -F "v28DensityChecked" dist/app-v5.js
          grep -F 'font-feature-settings:"zero" 0' dist/app-v5.js
          grep -F ".click-burst{contain:layout paint style}" dist/app-v5.js
          grep -F "limitEffects('.click-burst', 2)" dist/app-v5.js
          grep -F "limitEffects('.meteor-hit-explosion', 1)" dist/app-v5.js
          grep -F ".planet-wrap{backface-visibility:hidden}" dist/app-v5.js
          ! grep -F "rewardInstantPulse" dist/app-v5.js
          grep -F "data-starry-quality" dist/app-v5.js
          grep -F "navigator.serviceWorker.register('/sw.js'" dist/app-v5.js
          grep -F "繁星生態系 Starry.phd" dist/app-v5.js
          grep -F '"display": "standalone"' dist/manifest.webmanifest
          grep -F '"src": "/icon-192.png"' dist/manifest.webmanifest
          grep -F '"src": "/icon-512.png"' dist/manifest.webmanifest
          ! grep -F "starry-login-frame" dist/app-v5.js
          ! grep -F "點擊隕石爆破 +0.01" dist/app-v5.js
          ! grep -F "STARRY 電池" dist/app-v5.js

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.0"
          command: deploy

      - name: Verify production website
        shell: bash
        run: |
          set -euo pipefail
          verified=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS --connect-timeout 10 --max-time 20 "https://starry.phd/?verify=${GITHUB_SHA}" -o /tmp/starry.html \
              && curl -fsS --connect-timeout 10 --max-time 20 "https://starry.phd/app-v5.js?verify=${GITHUB_SHA}" -o /tmp/starry-app.js \
              && curl -fsS --connect-timeout 10 --max-time 20 "https://starry.phd/manifest.webmanifest?verify=${GITHUB_SHA}" -o /tmp/starry-manifest.json \
              && curl -fsS --connect-timeout 10 --max-time 20 "https://starry.phd/sw.js?verify=${GITHUB_SHA}" -o /tmp/starry-sw.js \
              && curl -fsS --connect-timeout 10 --max-time 20 "https://starry.phd/icon-192.png?verify=${GITHUB_SHA}" -o /tmp/starry-icon-192.png \
              && curl -fsS --connect-timeout 10 --max-time 20 "https://starry.phd/icon-512.png?verify=${GITHUB_SHA}" -o /tmp/starry-icon-512.png \
              && grep -F "https://id.starry.phd/api/google-sync" /tmp/starry-app.js >/dev/null \
              && grep -F "use_fedcm_for_prompt" /tmp/starry-app.js >/dev/null \
              && grep -F "starry-login-sheet" /tmp/starry-app.js >/dev/null \
              && grep -F -- "--rock-poly" /tmp/starry-app.js >/dev/null \
              && grep -F "#immersiveToggle{display:none!important}" /tmp/starry-app.js >/dev/null \
              && grep -F "battery-reward-instant" /tmp/starry-app.js >/dev/null \
              && grep -F "polygon(50% 0,100% 88%,6% 100%)" /tmp/starry-app.js >/dev/null \
              && grep -F ".status-pill{display:none!important}" /tmp/starry-app.js >/dev/null \
              && grep -F "v28DensityChecked" /tmp/starry-app.js >/dev/null \
              && grep -F 'font-feature-settings:"zero" 0' /tmp/starry-app.js >/dev/null \
              && grep -F ".click-burst{contain:layout paint style}" /tmp/starry-app.js >/dev/null \
              && grep -F "limitEffects('.click-burst', 2)" /tmp/starry-app.js >/dev/null \
              && grep -F "limitEffects('.meteor-hit-explosion', 1)" /tmp/starry-app.js >/dev/null \
              && grep -F ".planet-wrap{backface-visibility:hidden}" /tmp/starry-app.js >/dev/null \
              && ! grep -F "rewardInstantPulse" /tmp/starry-app.js >/dev/null \
              && grep -F "data-starry-quality" /tmp/starry-app.js >/dev/null \
              && grep -F "navigator.serviceWorker.register('/sw.js'" /tmp/starry-app.js >/dev/null \
              && grep -F '"display": "standalone"' /tmp/starry-manifest.json >/dev/null \
              && grep -F '"src": "/icon-192.png"' /tmp/starry-manifest.json >/dev/null \
              && grep -F '"src": "/icon-512.png"' /tmp/starry-manifest.json >/dev/null; then
              verified=1
              break
            fi
            sleep 5
          done
          test "$verified" = "1"
          grep -F 'starryMeteorRewardTier' /tmp/starry-app.js
          grep -F 'universe-readability-v41' /tmp/starry-app.js
          grep -F 'starrySafePlanetPosition' /tmp/starry-app.js
          grep -F "app-v5.js" /tmp/starry.html
          grep -F "starry:meteor-blasted" /tmp/starry-app.js
          grep -F "https://id.starry.phd/api/starry-game/battery" /tmp/starry-app.js
          grep -F "reward.toFixed(2)" /tmp/starry-app.js
          grep -F "battery-reward-instant" /tmp/starry-app.js
          grep -F "獎勵 +" /tmp/starry-app.js
          grep -F "v28DensityChecked" /tmp/starry-app.js
          grep -F 'font-feature-settings:"zero" 0' /tmp/starry-app.js
          grep -F ".click-burst{contain:layout paint style}" /tmp/starry-app.js
          grep -F "limitEffects('.click-burst', 2)" /tmp/starry-app.js
          grep -F "limitEffects('.meteor-hit-explosion', 1)" /tmp/starry-app.js
          grep -F ".planet-wrap{backface-visibility:hidden}" /tmp/starry-app.js
          ! grep -F "rewardInstantPulse" /tmp/starry-app.js
          grep -F "繁星生態系 Starry.phd" /tmp/starry-app.js
          grep -F "starry-shell-v25" /tmp/starry-sw.js
          test -s /tmp/starry-icon-192.png
          test -s /tmp/starry-icon-512.png
          ! grep -F "starry-login-frame" /tmp/starry-app.js
          ! grep -F "點擊隕石爆破 +0.01" /tmp/starry-app.js
          ! grep -F "STARRY 電池" /tmp/starry-app.js

          status="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/battery-api.json -w '%{http_code}' "https://id.starry.phd/api/starry-game/battery")"
          test "$status" = "401"
          grep -F '"authenticated":false' /tmp/battery-api.json

          curl -fsS --connect-timeout 10 --max-time 20 "https://id.starry.phd/starry-main-login" -o /tmp/starry-login.html
          grep -F "登入 Starry ID" /tmp/starry-login.html
          grep -F "appId: 'starryphd'" /tmp/starry-login.html

          curl -sS --connect-timeout 10 --max-time 20 -D /tmp/google-sync-headers.txt -o /tmp/google-sync-options.txt \
            -X OPTIONS \
            -H "Origin: https://starry.phd" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" \
            "https://id.starry.phd/api/google-sync"
          grep -Fi "access-control-allow-origin: https://starry.phd" /tmp/google-sync-headers.txt
          grep -Fi "access-control-allow-credentials: true" /tmp/google-sync-headers.txt
