name: Gratitude Starry - CI and independent deployment
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/gratitude-starry/**'
      - '.github/workflows/gratitude-starry.yml'
  push:
    branches: [main]
    paths:
      - 'apps/gratitude-starry/**'
      - '.github/workflows/gratitude-starry.yml'
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gratitude-starry
    steps:
      - uses: actions/checkout@v4
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Run back-end regression tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Typecheck Cloudflare Worker
        run: npx tsc --project tsconfig.worker.json
      - name: Prevent future-dated Cloudflare compatibility versions
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('wrangler.jsonc','utf8');
          const value = source.match(/"compatibility_date"\s*:\s*"(\d{4}-\d{2}-\d{2})"/);
          if (!value) throw Error('Missing Cloudflare compatibility date');
          const todayUTC = new Date().toISOString().slice(0,10);
          if (value[1] > todayUTC) throw Error('Cloudflare compatibility date is in the future UTC: '+value[1]);
          console.log('UTC compatibility date validated: '+value[1]);
          NODE
      - name: Validate Worker deployment bundle
        run: npx wrangler deploy --dry-run
  deploy:
    needs: test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
        working-directory: apps/gratitude-starry
      - name: Build frontend
        run: npm run build
        working-directory: apps/gratitude-starry
      - name: Verify Starry ID sign-in destination before first production release
        shell: bash
        run: |
          set -euo pipefail
          verified=0
          for attempt in $(seq 1 8); do
            if curl -fsS --connect-timeout 10 --max-time 20 https://id.starry.phd/auth/gratitude -o /tmp/gratitude-auth.html \
               && grep -F '繁星感恩日記' /tmp/gratitude-auth.html >/dev/null; then
              verified=1
              break
            fi
            sleep 8
          done
          test "$verified" = "1"
      - name: Deploy only gratitude-starry Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/gratitude-starry
          wranglerVersion: "4.151.0"
          command: deploy
      - name: Verify custom-domain production site
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsS --connect-timeout 10 --max-time 20 https://gratitude.starry.phd/api/health | grep -F '"service":"gratitude-starry"'               && curl -fsS --connect-timeout 10 --max-time 20 https://gratitude.starry.phd/ | grep -F '繁星感恩日記'; then
              # A public browser must never see a private diary, media or an authenticated session.
              curl -fsS --connect-timeout 10 --max-time 20 -D /tmp/gratitude-session-headers.txt \
                https://gratitude.starry.phd/api/session -o /tmp/gratitude-anonymous-session.json
              grep -F '"authenticated":false' /tmp/gratitude-anonymous-session.json
              grep -Fi 'cache-control: no-store' /tmp/gratitude-session-headers.txt
              entry_status=$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/gratitude-private-entry.txt -w '%{http_code}' \
                'https://gratitude.starry.phd/api/entries?day=2026-10-23')
              media_status=$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/gratitude-private-media.txt -w '%{http_code}' \
                'https://gratitude.starry.phd/api/media/00000000-0000-0000-0000-000000000001')
              test "$entry_status" = '401'
              test "$media_status" = '401'
              echo 'Verified production website, anonymous session and diary privacy.'
              exit 0
            fi
            sleep 10
          done
          echo 'Production URL verification failed.'
          exit 1
