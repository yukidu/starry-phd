name: Starry Main PR Verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-ui-and-rewards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify bundled scripts
        run: |
          mkdir -p dist
          cp app-v5.js dist/app-v5.js
          cat meteor-reward-bands-v41.js meteor-v14.js visual-v15.js interaction-v16.js battery-game-v18.js site-meta-v24.js pwa-v25.js meteor-feedback-v27.js meteor-density-v28.js rapid-tap-guard-v30.js solid-planets-v32.js universe-readability-v41.js navigation-safe-v44.js solar-hero-v51.js >> dist/app-v5.js
          node --check dist/app-v5.js
          node --test tests/*.test.mjs
          grep -F '.universe > #meteorLayer{position:absolute;inset:0;z-index:1' index.html
          grep -F '.universe > .planet-lane{z-index:2;pointer-events:none}' index.html
          grep -F '.click-burst{contain:layout style;overflow:visible!important}' dist/app-v5.js
          grep -F "const shardCount = quality === 'eco' ? 2" dist/app-v5.js
          grep -F "if (!meteorNoiseBuffer)" dist/app-v5.js
          grep -F "box-shadow:none!important;" dist/app-v5.js
          grep -F "if (now - lastMeteorBlastAt < 220) return;" dist/app-v5.js
          grep -F 'currentClickRing=ring;' dist/app-v5.js
          grep -F 'if(now-lastClickSoundAt>=80)' dist/app-v5.js
          grep -F 'html[data-starry-quality="eco"] .milky-way{filter:none!important;animation:none!important' dist/app-v5.js
          ! grep -F 'html[data-starry-interacting="1"] .milky-way' dist/app-v5.js
          grep -F '.click-spark{display:none!important}' index.html
          grep -F 'const optimisticAwards = new Map();' dist/app-v5.js
          grep -F 'rewardQueue.push({ rock, x, y, id });' dist/app-v5.js
          grep -F 'currentBalance = number; // Always display the confirmed server ledger.' dist/app-v5.js
          grep -F 'flashBattery();' dist/app-v5.js
          grep -F 'battery-charge-bolt' dist/app-v5.js
          grep -F 'battery-value:not(.login-ready)' dist/app-v5.js
          grep -F -- '-webkit-appearance:none!important;appearance:none!important' dist/app-v5.js
          grep -F '#starryBatteryCenter{filter:none!important}' dist/app-v5.js
          ! grep -F '#starryBatteryCenter{filter:drop-shadow(' dist/app-v5.js
          grep -F 'starryMeteorRewardTier' dist/app-v5.js
          grep -F 'universe-readability-v41' dist/app-v5.js
          grep -F 'starrySafePlanetPosition' dist/app-v5.js
          grep -F 'window.starryPerformance' dist/app-v5.js
          grep -F "quality === 'eco'" dist/app-v5.js
          grep -F 'primaryStarFraction' dist/app-v5.js
          grep -F 'lastRenderedPlanetYaw' dist/app-v5.js
          grep -F 'starrySolarParallaxX' dist/app-v5.js
          grep -F 'translate3d(calc(-50% + var(--starry-solar-x,0px)),-67.5%,0)' dist/app-v5.js
          grep -F 'rgba(255,241,166,.88)' dist/app-v5.js
          grep -F 'filter:blur(12px)' dist/app-v5.js
          ! grep -F 'starrySolarPlasma' dist/app-v5.js

          grep -F '已安裝繁星艦長' dist/app-v5.js
          grep -F 'color:#fff4a9' dist/app-v5.js
          grep -F 'return baseY-upperRaise;' dist/app-v5.js
          grep -F 'content:none!important;display:none!important' dist/app-v5.js
