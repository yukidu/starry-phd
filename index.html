<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#03030b" />
  <meta name="description" content="Starry.phd — 穿梭繁星、行星與未知文明的入口。" />
  <title>Starry.phd｜繁星宇宙</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    html, body {
      touch-action: none;
      overscroll-behavior: none;
    }
    button { touch-action: manipulation; }
    .nav-data { display: none !important; }
    .free-look-hint {
      position: fixed;
      z-index: 17;
      left: 50%;
      top: max(18px, env(safe-area-inset-top));
      transform: translateX(-50%);
      padding: 7px 12px;
      border: 1px solid rgba(145, 220, 255, .16);
      border-radius: 999px;
      background: rgba(4, 10, 24, .34);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: rgba(204, 236, 255, .58);
      font-size: 10px;
      letter-spacing: .12em;
      pointer-events: none;
      transition: opacity .6s ease, transform .6s ease;
      animation: hintFloat 2.4s ease-in-out infinite;
    }
    .free-look-hint.hidden {
      opacity: 0;
      transform: translate(-50%, -8px);
    }
    body.free-look-dragging { cursor: grabbing; }
    @keyframes hintFloat {
      50% { transform: translateX(-50%) translateY(3px); }
    }
    @media (max-width: 760px) {
      .free-look-hint {
        top: max(58px, calc(env(safe-area-inset-top) + 46px));
        font-size: 9px;
      }
    }
  </style>
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="nebula nebula-a" aria-hidden="true"></div>
  <div class="nebula nebula-b" aria-hidden="true"></div>
  <div class="meteor-layer" id="meteorLayer" aria-hidden="true"></div>

  <div class="universe" aria-hidden="true">
    <div class="planet-lane" id="planetLane">
      <div class="planet-wrap p1"><div class="planet mercury"><span></span></div><em>水星</em></div>
      <div class="planet-wrap p2"><div class="planet venus"><span></span></div><em>金星</em></div>
      <div class="planet-wrap p3"><div class="planet earth"><span></span></div><em>地球</em></div>
      <div class="planet-wrap p4"><div class="planet mars"><span></span></div><em>火星</em></div>
      <div class="planet-wrap p5"><div class="planet jupiter"><span></span></div><em>木星</em></div>
      <div class="planet-wrap p6"><div class="planet saturn"><span></span><i class="ring"></i></div><em>土星</em></div>
      <div class="planet-wrap p7"><div class="planet uranus"><span></span></div><em>天王星</em></div>
      <div class="planet-wrap p8"><div class="planet neptune"><span></span></div><em>海王星</em></div>
      <div class="planet-wrap p9"><div class="planet pluto"><span></span></div><em>冥王星</em></div>
    </div>
  </div>

  <div class="nav-data" aria-hidden="true">
    <span id="velocity">08.6c</span>
    <span id="sector">ORION-09</span>
  </div>

  <div class="free-look-hint" id="freeLookHint">↔ 滑動探索宇宙</div>

  <main class="hero">
    <div class="brand-mark" aria-label="Starry.phd">
      <span class="brand-kicker">ENTER THE STARRY UNIVERSE</span>
      <h1>STARRY<span>.PHD</span></h1>
      <p>穿越繁星，前往未知的下一個世界。</p>
    </div>

    <section class="store-zone" aria-label="應用商店入口">
      <button class="portal-btn" type="button" data-store="Google Play">
        <span class="portal-icon play-icon" aria-hidden="true">▶</span>
        <span class="portal-copy"><small>EXPLORE ON</small><strong>Google Play</strong></span>
        <span class="portal-shimmer"></span>
      </button>

      <button class="portal-btn" type="button" data-store="App Store">
        <span class="portal-icon apple-icon" aria-hidden="true">◈</span>
        <span class="portal-copy"><small>DISCOVER ON</small><strong>App Store</strong></span>
        <span class="portal-shimmer"></span>
      </button>
    </section>
  </main>

  <div class="status-pill" aria-live="polite"><span class="status-dot"></span> 深空導航系統連線中</div>

  <div class="portal-modal" id="portalModal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="portal-card">
      <div class="portal-core"><span></span><span></span><span></span></div>
      <p class="modal-label">TRANSMISSION RECEIVED</p>
      <h2 id="portalMessage">量子航道準備中</h2>
      <p class="modal-sub">訊號正在穿越未知維度，敬請期待。</p>
      <button id="closeModal" type="button">返回宇宙</button>
    </div>
  </div>

  <script src="./app.js"></script>
  <script>
    (() => {
      const universe = document.querySelector('.universe');
      const starfield = document.getElementById('starfield');
      const nebulaA = document.querySelector('.nebula-a');
      const nebulaB = document.querySelector('.nebula-b');
      const meteorLayer = document.getElementById('meteorLayer');
      const hint = document.getElementById('freeLookHint');

      let dragging = false;
      let pointerId = null;
      let lastX = 0;
      let lastY = 0;
      let panX = 0;
      let panY = 0;
      let velocityX = 0;
      let velocityY = 0;
      let inertiaFrame = 0;

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

      function limits() {
        return {
          x: Math.min(window.innerWidth * 0.24, 190),
          y: Math.min(window.innerHeight * 0.18, 120)
        };
      }

      function applyFreeLook() {
        const limit = limits();
        panX = clamp(panX, -limit.x, limit.x);
        panY = clamp(panY, -limit.y, limit.y);

        const nx = limit.x ? panX / limit.x : 0;
        const ny = limit.y ? panY / limit.y : 0;

        if (universe) {
          universe.style.translate = `${panX}px ${panY}px`;
          universe.style.perspectiveOrigin = `${50 - nx * 13}% ${50 - ny * 10}%`;
        }
        if (starfield) starfield.style.translate = `${panX * 0.13}px ${panY * 0.09}px`;
        if (nebulaA) nebulaA.style.transform = `translate3d(${panX * 0.2}px, ${panY * 0.14}px, 0)`;
        if (nebulaB) nebulaB.style.transform = `translate3d(${panX * 0.11}px, ${panY * 0.08}px, 0)`;
        if (meteorLayer) meteorLayer.style.transform = `translate3d(${panX * 0.08}px, ${panY * 0.06}px, 0)`;
      }

      function stopInertia() {
        if (inertiaFrame) cancelAnimationFrame(inertiaFrame);
        inertiaFrame = 0;
      }

      function runInertia() {
        if (dragging) return;
        velocityX *= 0.91;
        velocityY *= 0.91;
        panX += velocityX;
        panY += velocityY;
        applyFreeLook();

        if (Math.abs(velocityX) > 0.08 || Math.abs(velocityY) > 0.08) {
          inertiaFrame = requestAnimationFrame(runInertia);
        } else {
          inertiaFrame = 0;
        }
      }

      function isInteractive(target) {
        return target instanceof Element && !!target.closest('button, .portal-modal, a, input, textarea, select');
      }

      window.addEventListener('pointerdown', (event) => {
        if (isInteractive(event.target)) return;
        stopInertia();
        dragging = true;
        pointerId = event.pointerId;
        lastX = event.clientX;
        lastY = event.clientY;
        velocityX = 0;
        velocityY = 0;
        document.body.classList.add('free-look-dragging');
        hint?.classList.add('hidden');
        try { document.body.setPointerCapture(pointerId); } catch (_) {}
      }, { passive: true });

      window.addEventListener('pointermove', (event) => {
        if (!dragging || event.pointerId !== pointerId) return;
        event.preventDefault();
        const dx = event.clientX - lastX;
        const dy = event.clientY - lastY;
        lastX = event.clientX;
        lastY = event.clientY;

        panX += dx * 0.92;
        panY += dy * 0.78;
        velocityX = dx * 0.72;
        velocityY = dy * 0.6;
        applyFreeLook();
      }, { passive: false });

      function endDrag(event) {
        if (!dragging || event.pointerId !== pointerId) return;
        dragging = false;
        document.body.classList.remove('free-look-dragging');
        try { document.body.releasePointerCapture(pointerId); } catch (_) {}
        pointerId = null;
        runInertia();
      }

      window.addEventListener('pointerup', endDrag, { passive: true });
      window.addEventListener('pointercancel', endDrag, { passive: true });
      window.addEventListener('resize', applyFreeLook, { passive: true });

      applyFreeLook();
      window.setTimeout(() => hint?.classList.add('hidden'), 5200);
    })();
  </script>
</body>
</html>
