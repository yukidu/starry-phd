<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#03030b" />
  <meta name="description" content="Starry.phd — 360°穿梭繁星、行星與未知文明。" />
  <title>Starry.phd｜繁星宇宙</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    html,body{touch-action:none;overscroll-behavior:none}
    button{touch-action:manipulation}
    .cockpit,.cockpit-top,.cockpit-left,.cockpit-right,.cockpit-bottom,.reticle,.hud{display:none!important}
    .nav-data{display:none!important}
    .planet-wrap{animation:none!important;will-change:transform,opacity;transition:opacity .18s linear;transform-origin:center}
    .universe{overflow:visible!important;perspective:none!important}
    .free-look-hint{position:fixed;z-index:18;left:50%;top:max(18px,env(safe-area-inset-top));transform:translateX(-50%);padding:7px 12px;border:1px solid rgba(145,220,255,.16);border-radius:999px;background:rgba(4,10,24,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:rgba(214,241,255,.7);font-size:10px;letter-spacing:.12em;pointer-events:none;transition:opacity .6s ease,transform .6s ease;animation:hintFloat 2.4s ease-in-out infinite}
    .free-look-hint.hidden{opacity:0;transform:translate(-50%,-8px)}
    @keyframes hintFloat{50%{transform:translateX(-50%) translateY(3px)}}
    .store-zone{position:fixed!important;left:50%!important;bottom:max(14px,env(safe-area-inset-bottom))!important;transform:translateX(-50%)!important;z-index:24!important;width:min(560px,calc(100vw - 28px))!important;margin:0!important;display:flex!important;flex-direction:row!important;justify-content:center!important;gap:10px!important;animation:none!important;pointer-events:auto!important}
    .store-zone .portal-btn{flex:1 1 0!important;min-width:0!important;height:58px!important}
    .store-zone .portal-icon{display:grid!important;place-items:center!important;padding:0!important;overflow:visible!important}
    .store-zone .portal-icon.play-icon,.store-zone .portal-icon.apple-icon{background:none!important;border:none!important;box-shadow:none!important;color:inherit!important}
    .store-zone .portal-icon svg{display:block;width:100%;height:100%;overflow:visible}
    .status-pill{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 68px)!important}
    .hero{padding-bottom:max(138px,18vh)!important}
    #immersiveToggle{position:fixed;z-index:26;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));min-height:38px;padding:0 13px;border:1px solid rgba(160,223,255,.22);border-radius:999px;color:rgba(229,247,255,.86);background:rgba(5,11,28,.38);box-shadow:0 8px 30px rgba(0,0,0,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:600 10px/1 "Noto Sans TC",system-ui,sans-serif;letter-spacing:.08em;cursor:pointer}
    #immersiveToggle.active{border-color:rgba(125,249,255,.55);color:#eaffff;box-shadow:0 0 18px rgba(75,175,255,.18)}
    .click-burst{position:fixed;z-index:60;left:0;top:0;width:16px;height:16px;pointer-events:none;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(164,244,255,.95);box-shadow:0 0 16px rgba(125,249,255,.95),0 0 42px rgba(143,94,255,.5);animation:burstRing .62s cubic-bezier(.16,1,.3,1) forwards}
    .click-burst::before,.click-burst::after{content:"";position:absolute;inset:50% auto auto 50%;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 13px #7df9ff;transform:translate(-50%,-50%);animation:burstCore .62s ease-out forwards}
    .click-burst::after{width:34px;height:1px;border-radius:0;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 14px #a67cff;animation:burstCross .62s ease-out forwards}
    .click-spark{position:absolute;left:50%;top:50%;width:3px;height:12px;border-radius:99px;background:linear-gradient(#fff,#7df9ff,transparent);transform-origin:50% 0;filter:drop-shadow(0 0 5px #7df9ff);animation:sparkFly .62s ease-out forwards}
    @keyframes burstRing{0%{opacity:1;transform:translate(-50%,-50%) scale(.25)}100%{opacity:0;transform:translate(-50%,-50%) scale(5.2)}}
    @keyframes burstCore{to{opacity:0;transform:translate(-50%,-50%) scale(3)}}
    @keyframes burstCross{to{opacity:0;transform:translate(-50%,-50%) rotate(180deg) scaleX(3)}}
    @keyframes sparkFly{0%{opacity:1;transform:rotate(var(--a)) translateY(-4px) scaleY(.4)}100%{opacity:0;transform:rotate(var(--a)) translateY(-58px) scaleY(1.2)}}
    @media(max-width:760px){.free-look-hint{top:max(58px,calc(env(safe-area-inset-top) + 46px));font-size:9px}.store-zone{width:calc(100vw - 18px)!important;gap:7px!important;bottom:max(9px,env(safe-area-inset-bottom))!important}.store-zone .portal-btn{height:54px!important;padding:0 10px!important;gap:8px!important;border-radius:14px!important}.store-zone .portal-icon{width:30px!important;height:30px!important;flex-basis:30px!important}.store-zone .portal-copy small{display:none!important}.store-zone .portal-copy strong{font-size:11px!important;white-space:nowrap}.status-pill{bottom:calc(max(9px,env(safe-area-inset-bottom)) + 62px)!important;max-width:74vw!important}#immersiveToggle{top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));min-height:34px;padding:0 10px;font-size:9px}.hero{padding-bottom:max(124px,17vh)!important}}
  </style>
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="nebula nebula-a" aria-hidden="true"></div>
  <div class="nebula nebula-b" aria-hidden="true"></div>
  <div class="meteor-layer" id="meteorLayer" aria-hidden="true"></div>

  <div class="universe" aria-hidden="true">
    <div class="planet-lane" id="planetLane">
      <div class="planet-wrap p1"><div class="planet mercury"><span></span></div><em>水星</em></div>
      <div class="planet-wrap p2"><div class="planet venus"><span></span></div><em>金星</em></div>
      <div class="planet-wrap p3"><div class="planet earth"><span></span></div><em>地球</em></div>
      <div class="planet-wrap p4"><div class="planet mars"><span></span></div><em>火星</em></div>
      <div class="planet-wrap p5"><div class="planet jupiter"><span></span></div><em>木星</em></div>
      <div class="planet-wrap p6"><div class="planet saturn"><span></span><i class="ring"></i></div><em>土星</em></div>
      <div class="planet-wrap p7"><div class="planet uranus"><span></span></div><em>天王星</em></div>
      <div class="planet-wrap p8"><div class="planet neptune"><span></span></div><em>海王星</em></div>
      <div class="planet-wrap p9"><div class="planet pluto"><span></span></div><em>冥王星</em></div>
    </div>
  </div>

  <div class="nav-data" aria-hidden="true"><span id="velocity">08.6c</span><span id="sector">ORION-09</span></div>
  <div class="free-look-hint" id="freeLookHint">↔ 拖曳 360° 探索九大行星</div>

  <main class="hero">
    <div class="brand-mark" aria-label="Starry.phd">
      <span class="brand-kicker">ENTER THE STARRY UNIVERSE</span>
      <h1>STARRY<span>.PHD</span></h1>
    </div>
    <section class="store-zone" aria-label="應用商店入口">
      <button class="portal-btn" type="button" data-store="Google Play">
        <span class="portal-icon play-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="img" aria-label="Google Play">
            <path fill="#34A853" d="M7.4 5.2c-.65.72-1.04 1.84-1.04 3.25v31.1c0 1.41.39 2.53 1.04 3.25L26.1 24 7.4 5.2Z"/>
            <path fill="#FBBC04" d="m26.1 24-18.7 18.8c1.02 1.12 2.67 1.25 4.53.2l21.9-12.48L26.1 24Z"/>
            <path fill="#EA4335" d="m33.83 17.47-21.9-12.48C10.07 3.94 8.42 4.07 7.4 5.2L26.1 24l7.73-6.53Z"/>
            <path fill="#4285F4" d="m41.2 21.66-7.37-4.19L26.1 24l7.73 6.52 7.37-4.19c2.53-1.44 2.53-3.23 0-4.67Z"/>
          </svg>
        </span>
        <span class="portal-copy"><small>EXPLORE ON</small><strong>Google Play</strong></span>
        <span class="portal-shimmer"></span>
      </button>
      <button class="portal-btn" type="button" data-store="App Store">
        <span class="portal-icon apple-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="img" aria-label="App Store">
            <defs>
              <linearGradient id="appStoreBlue" x1="8" y1="5" x2="40" y2="43" gradientUnits="userSpaceOnUse">
                <stop stop-color="#17A9F5"/>
                <stop offset="1" stop-color="#0677E9"/>
              </linearGradient>
            </defs>
            <rect x="3" y="3" width="42" height="42" rx="10" fill="url(#appStoreBlue)"/>
            <path d="M17 33.5h-4.2M35.2 33.5H23M17.7 28.7 28.3 10.4M30.3 28.7 20.2 11.2M14.4 26.8h19.2" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="portal-copy"><small>DISCOVER ON</small><strong>App Store</strong></span>
        <span class="portal-shimmer"></span>
      </button>
    </section>
  </main>

  <div class="status-pill" aria-live="polite"><span class="status-dot"></span> 360° 星際導航啟動</div>

  <div class="portal-modal" id="portalModal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="portal-card"><div class="portal-core"><span></span><span></span><span></span></div><p class="modal-label">TRANSMISSION RECEIVED</p><h2 id="portalMessage">量子航道準備中</h2><p class="modal-sub">訊號正在穿越未知維度，敬請期待。</p><button id="closeModal" type="button">返回宇宙</button></div>
  </div>

  <script src="./app-v5.js"></script>
</body>
</html>
